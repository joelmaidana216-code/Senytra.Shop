<!DOCTYPE html>
<!-- Solo para que Netlify detecte el formulario de pedidos al desplegar. No se enlaza desde el sitio. -->
<html lang="es">
  <head><meta charset="UTF-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
  <body>
    <form name="pedidos" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pedidos">
      <input name="reference">
      <input name="minecraft">
      <input name="email">
      <input name="country">
      <input name="payment">
      <textarea name="items"></textarea>
      <input name="total">
      <input name="language">
      <input name="bot-field">
    </form>
  </body>
</html>
