# Sitio estático sin paso de build: este comando reemplaza cualquier "Build command" configurado en el panel de Netlify.
[build]
  command = "echo 'Sin paso de build'"
  publish = "public"

[functions]
  directory = "netlify/functions"

# /api/tebex-checkout → netlify/functions/tebex-checkout.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Páginas de retorno del pago: no se indexan ni se guardan en caché.
[[headers]]
  for = "/success.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/cancel.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
